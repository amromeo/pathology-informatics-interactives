name: Check source links
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-external-links.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-link-report
          path: review/external-links.json
